  </g><path d="M0 24.94L6.5 33L0 41.06L-6.5 33Z" fill="#fff" stroke="#230d63" stroke-width="2.5" stroke-linejoin="round"/></g><g transform="rotate(180 125 175)"><g transform="translate(37 44)"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
